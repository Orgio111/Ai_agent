apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-broker
  namespace: jarvis
  labels:
    app: jarvis-broker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-broker
  template:
    metadata:
      labels:
        app: jarvis-broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: broker
          image: jarvis/broker:latest
          ports:
            - containerPort: 8001
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: jarvis-config
                  key: REDIS_URL
            - name: BROKER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: jarvis-config
                  key: BROKER_ADDR
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: jarvis
spec:
  selector:
    app: jarvis-broker
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-broker-hpa
  namespace: jarvis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-broker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
