apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-agent-core
  namespace: jarvis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jarvis-agent-core
  template:
    metadata:
      labels:
        app: jarvis-agent-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: agent-core
          image: jarvis/agent-core:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jarvis-config
          env:
            - name: NVIDIA_NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jarvis-secrets
                  key: NVIDIA_NIM_API_KEY
            - name: BROKER_WS_URL
              value: "ws://broker:8001/ws"
            - name: MEMORY_URL
              value: "http://memory:8003"
            - name: LLM_ENGINE_URL
              value: "http://llm-engine:8002"
            - name: TOOL_SYSTEM_URL
              value: "http://tool-system:8004"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: jarvis
spec:
  selector:
    app: jarvis-agent-core
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-agent-core-hpa
  namespace: jarvis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-agent-core
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
