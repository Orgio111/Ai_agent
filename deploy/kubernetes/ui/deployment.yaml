apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-tool-system
  namespace: jarvis
  labels:
    app: jarvis-tool-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-tool-system
  template:
    metadata:
      labels:
        app: jarvis-tool-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: tool-system
          image: jarvis/tool-system:latest
          ports:
            - containerPort: 8004
          env:
            - name: TOOL_SYSTEM_PORT
              value: "8004"
            - name: SANDBOX_DIR
              value: "/tmp/jarvis-sandbox"
            - name: DOCKER_SANDBOX
              value: "false"
            - name: TOOL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: jarvis-secrets
                  key: TOOL_AUTH_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: sandbox-dir
              mountPath: /tmp/jarvis-sandbox
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sandbox-dir
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tool-system
  namespace: jarvis
spec:
  selector:
    app: jarvis-tool-system
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-tool-system-hpa
  namespace: jarvis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-tool-system
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
