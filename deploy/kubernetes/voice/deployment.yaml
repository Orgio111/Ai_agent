apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-voice
  namespace: jarvis
  labels:
    app: jarvis-voice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-voice
  template:
    metadata:
      labels:
        app: jarvis-voice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
    spec:
      containers:
        - name: voice
          image: jarvis/voice:latest
          ports:
            - containerPort: 8005
          env:
            - name: VOICE_PORT
              value: "8005"
            - name: WHISPER_MODEL
              value: "base"
            - name: WHISPER_DEVICE
              value: "cpu"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: whisper-cache
              mountPath: /root/.cache/whisper
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: whisper-cache
          persistentVolumeClaim:
            claimName: whisper-cache-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-cache-pvc
  namespace: jarvis
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voice
  namespace: jarvis
spec:
  selector:
    app: jarvis-voice
  ports:
    - name: http
      port: 8005
      targetPort: 8005
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-voice-hpa
  namespace: jarvis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jarvis-voice
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
