name: JARVIS Deploy Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/jarvis

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [llm-engine, memory, agent-core, tool-system, voice]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-broker:
    name: Build & Push Rust Broker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-broker
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push broker
        uses: docker/build-push-action@v6
        with:
          context: services/broker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, build-push-broker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Apply namespace and config
        run: kubectl apply -f deploy/kubernetes/namespace.yaml

      - name: Deploy all services
        run: |
          kubectl apply -f deploy/kubernetes/memory/deployment.yaml
          kubectl apply -f deploy/kubernetes/broker/deployment.yaml
          kubectl apply -f deploy/kubernetes/llm-engine/deployment.yaml
          kubectl apply -f deploy/kubernetes/agent-core/deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jarvis-broker -n jarvis --timeout=5m
          kubectl rollout status deployment/jarvis-llm-engine -n jarvis --timeout=5m
          kubectl rollout status deployment/jarvis-agent-core -n jarvis --timeout=5m
          kubectl rollout status deployment/jarvis-memory -n jarvis --timeout=5m

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl --restart=Never -n jarvis \
            --command -- curl -f http://agent-core:8000/health
          kubectl wait --for=condition=complete pod/smoke-test -n jarvis --timeout=30s
          kubectl logs smoke-test -n jarvis
          kubectl delete pod smoke-test -n jarvis
