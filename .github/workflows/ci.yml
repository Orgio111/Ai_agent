name: JARVIS CI Pipeline

on:
  push:
    branches: [main, 'claude/**', 'feature/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # ─── Python Linting + Type Check ──────────────────────────────────────────
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy types-redis types-requests

      - name: Ruff lint
        run: ruff check services/*/src/ ai_core/ --select E,W,F,I --ignore E501

      - name: Type check agent-core
        working-directory: services/agent-core
        run: |
          pip install -r requirements.txt
          mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Type check llm-engine
        working-directory: services/llm-engine
        run: |
          pip install -r requirements.txt
          mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Type check memory
        working-directory: services/memory
        run: |
          pip install -r requirements.txt
          mypy src/ --ignore-missing-imports --no-strict-optional

  # ─── Python Unit Tests ────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ai_core deps
        working-directory: ai_core
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run ai_core tests (offline)
        env:
          NVIDIA_NIM_API_KEY: nvapi-test-offline
        run: |
          pytest tests/ -v \
            --ignore=tests/test_e2e_smoke.py \
            --cov=ai_core \
            --cov-report=xml \
            -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  # ─── Rust Build + Tests ───────────────────────────────────────────────────
  rust-broker:
    name: Rust Broker Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/broker

      - name: Clippy (broker)
        working-directory: services/broker
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustfmt check
        working-directory: services/broker
        run: cargo fmt --check

      - name: Build broker (release)
        working-directory: services/broker
        run: cargo build --release

      - name: Run broker tests
        working-directory: services/broker
        run: cargo test --release

  # ─── Rust Performance Module ──────────────────────────────────────────────
  rust-performance:
    name: Rust Performance Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: performance

      - name: Clippy + build
        working-directory: performance
        run: |
          cargo clippy -- -D warnings
          cargo build --release

  # ─── TypeScript UI Build ──────────────────────────────────────────────────
  ui-build:
    name: React UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/ui/package.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: TypeScript check
        working-directory: services/ui
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: services/ui
        run: npm run build
        env:
          VITE_AGENT_CORE_URL: http://localhost:8000
          VITE_BROKER_WS_URL: ws://localhost:8001/ws

  # ─── Docker Build Validation ──────────────────────────────────────────────
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [llm-engine, memory, agent-core, tool-system, voice]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: jarvis/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Integration Tests ────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, rust-broker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        working-directory: ai_core
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run E2E smoke tests
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/test_e2e_smoke.py -v -x --timeout=120
        continue-on-error: true

  # ─── Security Scan ────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Python safety check
        run: |
          pip install safety
          safety check -r ai_core/requirements.txt --output text
        continue-on-error: true
